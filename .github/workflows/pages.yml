name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # mainブランチにpushされたら実行（masterの場合は master に変更）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # package-lock.json がなくてもエラーにならない設定
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # package.json を元に依存関係をインストール
      - name: Install dependencies
        run: npm install

      # package.json 内の "build": "vite build" を実行して dist/ を生成
      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ビルドされた dist フォルダをアップロード
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
